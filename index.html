<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Q4 Habit Tracker</title>
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Q4 Habits">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = one screen at a time with a bottom tab bar; desktop = top nav + wide content column. Navy ledger look carried over from the Q4 sheet. */
:root{
  color-scheme:light;
  --bg:#F4F6FA; --panel:#FFFFFF; --ink:#14213D; --muted:#5D6880; --line:#DCE2EE; --soft:#EAF0FA;
  --band:#1F3864; --band-ink:#FFFFFF; --accent:#1F3864; --accent-ink:#FFFFFF;
  --today:#E9B83F; --today-soft:#FFF5D8;
  --ok:#2F7D4F; --ok-soft:#DDF0E4; --warn:#A8701A; --warn-soft:#FBEED2; --bad:#B23B3B; --bad-soft:#F7DFDF;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1221; --panel:#141C30; --ink:#E6EAF3; --muted:#98A3BC; --line:#25304A; --soft:#1A2440;
  --band:#18233D; --band-ink:#E6EAF3; --accent:#93AEEB; --accent-ink:#0C1221;
  --today:#E3B344; --today-soft:#352D1A;
  --ok:#5BC08A; --ok-soft:#163326; --warn:#E2A848; --warn-soft:#382C17; --bad:#EE7C7C; --bad-soft:#3B1E24;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1221; --panel:#141C30; --ink:#E6EAF3; --muted:#98A3BC; --line:#25304A; --soft:#1A2440;
  --band:#18233D; --band-ink:#E6EAF3; --accent:#93AEEB; --accent-ink:#0C1221;
  --today:#E3B344; --today-soft:#352D1A;
  --ok:#5BC08A; --ok-soft:#163326; --warn:#E2A848; --warn-soft:#382C17; --bad:#EE7C7C; --bad-soft:#3B1E24;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
[hidden]{display:none!important}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--today);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1160px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.75;letter-spacing:0}
.top-nav{display:none;gap:4px;margin-left:auto}
.top-nav button{background:transparent;border:0;color:var(--band-ink);opacity:.75;padding:8px 12px;border-radius:999px;font-weight:600}
.top-nav button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.14)}
.save{margin-left:auto;font-size:12px;opacity:.8;white-space:nowrap}
main{flex:1;width:100%;max-width:1160px;margin-inline:auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:0}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){.tabs{display:none}.top-nav{display:flex}.save{margin-left:12px}main{padding-bottom:40px}}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-warn{background:var(--warn-soft);color:var(--warn)}.s-bad{background:var(--bad-soft);color:var(--bad)}.s-none{background:var(--soft);color:var(--muted)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.datebar{display:flex;align-items:center;gap:10px}
.datebar .lbl{flex:1;min-width:0}
.datebar .lbl b{display:block;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.15}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.areas{display:grid;gap:14px}
@media (min-width:900px){.areas{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.area{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.area-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--band);color:var(--band-ink)}
.area-h h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--body);font-weight:700}
.area-h .wk{font-size:12px;font-weight:600;opacity:.85}
.habit{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;min-height:58px}
.area-h + .habit{border-top:0}
.chk{flex:none;width:28px;height:28px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.chk svg{width:16px;height:16px;opacity:0}
.habit[aria-pressed="true"] .chk,.habit[data-met="true"] .chk{background:var(--ok);border-color:var(--ok);transform:scale(1.04)}
.habit[aria-pressed="true"] .chk svg,.habit[data-met="true"] .chk svg{opacity:1}
.habit.num{cursor:default;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.numin{width:64px;height:38px;text-align:center;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 4px}
.numin::-webkit-inner-spin-button,.numin::-webkit-outer-spin-button,.numcell::-webkit-inner-spin-button,.numcell::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numin,.numcell{-moz-appearance:textfield;appearance:textfield}
.numcell{width:44px;text-align:center;font-weight:700;font-size:14px;padding:0;color:var(--ink)}
.numcell.met{background:var(--ok);border-color:var(--ok);color:#fff}
@media (max-width:520px){.habit.num .stepper{flex:1 1 100%;padding-left:40px}}
.habit .nm{flex:1;min-width:0}
.habit .nm b{display:block;font-weight:600}
.habit .nm span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.chk{transition:none}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center}
.grid thead th{font-size:11px;font-weight:700;color:var(--muted);padding:8px 2px;letter-spacing:.04em}
.grid thead th.td{color:var(--ink);background:var(--today-soft)}
.grid .hn{text-align:left;padding:9px 10px;position:sticky;left:0;background:var(--panel);min-width:150px;max-width:220px;font-weight:600;font-size:14px;z-index:1}
.grid tr.ah td,.grid tr.ah th{background:var(--band);color:var(--band-ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px}
.grid tr.ah .hn{background:var(--band)}
.cell{width:40px;height:40px;margin:3px auto;border-radius:9px;border:1.5px solid var(--line);background:none;display:grid;place-items:center}
.cell svg{width:16px;height:16px;opacity:0}
.cell[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.cell[aria-pressed="true"] svg{opacity:1}
.cell:disabled{opacity:.3;cursor:default}
td.tdc{background:var(--today-soft)}
.dn{font-weight:700;font-size:13px;min-width:56px;padding:0 8px!important;white-space:nowrap}
.grid tfoot td{font-weight:700;font-size:12px;padding:8px 2px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin-top:2px}
.kpi .v.sm{font-size:19px;padding-top:6px}
.kpi .d{font-size:12px;color:var(--muted)}
.two{display:grid;gap:14px}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.arow{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;align-items:center;gap:10px;padding:7px 0}
.arow .track{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.arow .track i{display:block;height:100%;border-radius:99px}
.arow b{font-size:13px;text-align:right}
.heat{display:grid;gap:3px;min-width:560px}
.heat .hl{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;align-self:center}
.heat .hd{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.heat .hc{height:22px;border-radius:5px;background:var(--soft);font-size:10px;display:grid;place-items:center;color:var(--ink);font-weight:600}
.heat .hc.cur{outline:2px solid var(--today);outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.score th,.score td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13px;white-space:nowrap}
.score th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.score th:first-child,.score td:first-child{text-align:left;white-space:normal;min-width:150px}
.score td.st{text-align:center}
.score .ar{font-size:11px;color:var(--muted);display:block}
.coach3{display:grid;gap:14px}
@media (min-width:760px){.coach3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.coach3 ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.focus{font-size:14px;display:grid;gap:8px;margin-top:8px}
.ai-out{white-space:pre-wrap;line-height:1.6;max-width:68ch;margin-top:12px}
.ai-out.empty{color:var(--muted)}
.qs{display:grid;gap:14px}
.q label,.fld label{display:block;font-weight:600;margin-bottom:6px}
textarea,.inp,select{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 12px}
.q textarea{width:100%;min-height:84px;resize:vertical}
.state{padding:28px 18px;text-align:center}
.state h2{margin-bottom:6px}
.note{font-size:12px;color:var(--muted)}
.set{display:grid;gap:14px}
.fld{display:grid;gap:4px}
.fld .inp{width:100%}
.aedit{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.aedit-h{width:100%;display:flex;gap:10px;align-items:center;padding:13px 14px;background:var(--soft);border:0;text-align:left;font-size:15px;min-height:50px}
.aedit-h b{font-weight:700}
.aedit-h .chev{width:18px;height:18px;flex:none;transition:transform .15s;color:var(--muted)}
.aedit-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.aedit-name{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:12px 0 8px;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.aedit-h .chev{transition:none}}
.aedit-name .cap{flex:1 1 200px;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.area-name{width:100%;font-weight:700}
.aedit-b{padding:4px 12px 12px}
.hedit{display:grid;grid-template-columns:34px minmax(0,1fr) 64px 150px 40px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.hedit .inp,.hedit select{width:100%;padding:7px 10px}
.hedit .cap{font-size:12px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.hsub{grid-column:1/-1;order:5;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;padding-top:2px}
.hsub select{width:auto;padding:5px 8px}
.hsub .inp{width:auto;padding:5px 8px}
.hsub input[data-hf="target"]{width:72px}
.hsub input[data-hf="unit"]{width:130px}
.mv{display:flex;flex-direction:column;gap:2px;grid-row:span 1}
.mv button{width:34px;height:22px;border:1px solid var(--line);background:var(--panel);border-radius:7px;display:grid;place-items:center;padding:0;color:var(--ink)}
.mv button svg{width:15px;height:15px}
.mv button:disabled{opacity:.3;cursor:default}
@media (max-width:560px){.hedit{grid-template-columns:34px minmax(0,1fr) 64px 40px}.hedit .ar-sel{grid-column:2/-1;order:3}.hsub{grid-column:2/-1}}
.confirmbox{background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.confirmbox p{flex:1;min-width:180px;font-size:13px}
.btn.sm{padding:5px 11px;font-size:13px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.save{background:none;border:0;color:var(--band-ink);padding:0;text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:1px;background:currentColor;opacity:.8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20}
@media (min-width:900px){.toast{bottom:24px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.thread{display:grid;gap:10px;margin-top:14px}
.sess-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.msg{border-radius:12px;padding:12px 14px;max-width:72ch;line-height:1.55}
.msg.ai{background:var(--soft)}
.msg.ai.live{white-space:pre-wrap}
.msg.me{background:var(--accent);color:var(--accent-ink);justify-self:end;max-width:85%;white-space:pre-wrap}
.msg.err{background:var(--bad-soft);color:var(--bad);white-space:pre-wrap}
.msg h3.ch{font-family:var(--display);font-size:14px;margin:10px 0 4px;letter-spacing:0}
.msg h3.ch:first-child{margin-top:0}
.msg p{margin:4px 0}
.msg .li{position:relative;padding-left:16px;margin:4px 0}
.msg .li::before{content:"";position:absolute;left:3px;top:.65em;width:6px;height:6px;border-radius:99px;background:var(--accent)}
.reply{display:grid;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.reply textarea{width:100%;min-height:80px;resize:vertical}
.past details{border-top:1px solid var(--line);padding:10px 0}
.past summary{cursor:pointer}
.pace{display:grid;gap:6px;margin-top:8px;font-size:14px}
.commit .clist{display:grid;gap:10px;margin-top:10px}
.citem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.citem p{font-weight:600}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.m-kept[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.m-partly[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.m-missed[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.iconbtn.sm{width:30px;height:30px;font-size:15px}
.daynote{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.daynote .cap{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.daynote .inp{flex:1 1 180px;padding:6px 10px}
.oedit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.oedit textarea{width:100%;min-height:64px;resize:vertical}
.oedit select{padding:6px 10px}
.view .habit,.view .cell,.view .numin,.view .numcell{pointer-events:none}
.view .habit{cursor:default}
.view .stepper button,.view .daynote,.view .commit,.view .banner,.view main [data-nav="setup"]{display:none!important}
.view .numin{background:transparent;border-color:transparent}
.view .save{cursor:default}
.sharebox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
#coach-card label:has(select[data-cweek]){display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;max-width:440px}
select[data-cweek]{width:100%;max-width:100%;padding:8px 10px}
.habit .nm>span{display:block}
.pace{font-size:12px;color:var(--muted);margin-top:1px}
.pace.p-due{color:var(--warn)}.pace.p-out{color:var(--bad)}.pace.p-met{color:var(--ok)}.pace.p-planned{color:var(--accent)}
.s-plan{background:var(--soft);color:var(--accent)}
.gsub{font-size:12px;color:var(--muted);padding:8px 14px 2px}
.prio{display:grid;gap:14px}
@media (min-width:900px){.prio{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}

.tgl .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}

.todaybar{gap:10px 14px}
.undo{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px;font-weight:600}

.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--soft);padding:1px 6px;border-radius:6px}
/* ===== Visual refresh: calm ground, navy = done, gold = today, orange = attention ===== */
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --ink:#0F1B33; --muted:#4A5570; --line:#E3E7EF; --soft:#E8EDF7; --seg:#E8EBF1;
  --band:#0F1B33; --band-ink:#FFFFFF; --accent:#1F3864; --accent-ink:#FFFFFF;
  --today:#E3A82B; --today-soft:#FFF3D6; --today-ink:#6B4A00;
  --ok:#1F3864; --ok-soft:#E8EDF7; --warn:#8A5A00; --warn-soft:#FFF3D6; --bad:#9A4508; --bad-soft:#FDEBDC; --risk:#C2610C;
  --dot-miss:#D5DBE6; --h1:#C9D5EE; --h2:#93AEEB; --h3:#3D5A99; --h4:#1F3864;
  --shadow:0 1px 2px rgba(15,27,51,.06); --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --panel:#141C30; --ink:#E6EAF3; --muted:#A3AEC6; --line:#26314B; --soft:#1C2742; --seg:#1C2742;
  --band:#1C2742; --band-ink:#E6EAF3; --accent:#93AEEB; --accent-ink:#0B1222;
  --today:#E3B344; --today-soft:#3A3018; --today-ink:#F2D38A;
  --ok:#93AEEB; --ok-soft:#1C2742; --warn:#E9B65A; --warn-soft:#3A3018; --bad:#F2A06B; --bad-soft:#3D2416; --risk:#F2A06B;
  --dot-miss:#34405E; --h1:#2A3A62; --h2:#3F5A99; --h3:#6F8FD6; --h4:#AFC4F2; --shadow:none}}
:root[data-theme="dark"]{
  --bg:#0B1222; --panel:#141C30; --ink:#E6EAF3; --muted:#A3AEC6; --line:#26314B; --soft:#1C2742; --seg:#1C2742;
  --band:#1C2742; --band-ink:#E6EAF3; --accent:#93AEEB; --accent-ink:#0B1222;
  --today:#E3B344; --today-soft:#3A3018; --today-ink:#F2D38A;
  --ok:#93AEEB; --ok-soft:#1C2742; --warn:#E9B65A; --warn-soft:#3A3018; --bad:#F2A06B; --bad-soft:#3D2416; --risk:#F2A06B;
  --dot-miss:#34405E; --h1:#2A3A62; --h2:#3F5A99; --h3:#6F8FD6; --h4:#AFC4F2; --shadow:none}
body::before{background:var(--bg)}
.top{background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line);padding-block:8px}
.brand{font-size:16px}.brand small{display:none}
.top-nav button{color:var(--muted);opacity:1}
.top-nav button[aria-current="page"]{background:var(--soft);color:var(--accent)}
.save{color:var(--muted);opacity:1;margin-left:auto}
.gear{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink);flex:none}
.gear[aria-current="page"]{background:var(--soft);color:var(--accent);border-color:var(--soft)}

.view .gear{display:none}
.tabs{grid-template-columns:repeat(4,1fr);padding-top:6px}
.tabs button{font-size:11.5px;gap:4px;padding:2px 0 10px}
.tabs button .ti{display:grid;place-items:center;width:56px;height:30px;border-radius:15px}

.tabs button[aria-current="page"] .ti{background:var(--soft)}
main{gap:16px;padding-top:16px}
.card{border:0;border-radius:var(--r);box-shadow:var(--shadow)}

.btn{border-color:var(--line)}

.iconbtn[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:var(--soft)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:8px 4px}

/* hero */
.hero{background:var(--panel);border-radius:20px;padding:18px;display:flex;gap:18px;align-items:center;box-shadow:var(--shadow)}

.chips{display:flex;gap:6px;flex-wrap:wrap}.chips .tag{font-size:12px;padding:4px 10px}
/* day strip */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayb{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);min-height:62px}

.dayb .dl{font-size:11px;font-weight:700;opacity:.85}.dayb .dn2{font-size:15px;font-weight:700}

.dayb.sel .db{background:rgba(255,255,255,.25)}.dayb.sel .db i{background:var(--today)}
/* toolbar, nudge, routine, celebration, snack */
.toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-radius:16px;padding:10px 12px 10px 16px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.nudge span{flex:1;min-width:180px}
.routine{background:#1F3864;color:#fff;border-radius:18px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .routine{background:#22325A}}
.routine b{display:block;font-size:15px}
.routine .segs{display:flex;gap:3px;margin-top:8px}.routine .segs i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}.routine .segs i.on{background:var(--today)}

.celebrate .iconbtn{border:0;background:transparent;color:var(--today-ink)}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:9;width:min(560px,calc(100% - 32px));background:#0F1B33;color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(15,27,51,.25)}

/* habit rows */

.habit.hrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px;min-height:62px;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--ink)}

.hrow .nm{flex:1;min-width:0;display:grid;gap:6px}

.hrow .hmeta{display:flex;align-items:center;gap:6px}

.metbtn{width:100%;height:48px;border-radius:14px;border:1px dashed #C9D1E0;background:transparent;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}

/* progress */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dark{background:#1C2742}}

function setMiss(k,id,on){D.miss=D.miss||{};const a=(D.miss[k]||[]).filter(x=>x!==id);if(on)a.push(id);if(a.length)D.miss[k]=a;else delete D.miss[k]}
function setTick(k,id,on){const arr=(D.ticks[k]||[]).filter(x=>x!==id);if(on){arr.push(id);setMiss(k,id,false)}if(arr.length)D.ticks[k]=arr;else delete D.ticks[k]}
const pgoal=h=>h&&!isNum(h)&&Number(h.pomo)>0?Number(h.pomo):0;
const isPomoNum=h=>isNum(h)&&/pomodoro/i.test((h.unit||"")+" "+(h.name||""));
function pcount(k,id){const o=D.pomos&&D.pomos[k];return o&&o[id]||0}
function pval(k,h){const o=D.pomos&&D.pomos[k];if(o&&o[h.id]!=null)return o[h.id];const g=pgoal(h);return g&&has(k,h.id)?g:0}
function pomoN(k,h){return pval(k,h)+(isPomoNum(h)?(val(k,h.id)||0):0)}
function setPomo(k,h,n){n=Math.max(0,Math.min(99,Math.round(n)));D.pomos=D.pomos||{};const o=Object.assign({},D.pomos[k]||{});if(n)o[h.id]=n;else delete o[h.id];if(Object.keys(o).length)D.pomos[k]=o;else delete D.pomos[k];
  const g=pgoal(h);if(g)setTick(k,h.id,n>=g)}
const CLOCK='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 3h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function storeTimer(){try{if(S.timer)localStorage.setItem("q4habits.timer",JSON.stringify(S.timer));else localStorage.removeItem("q4habits.timer")}catch(e){}}
function startTimer(id,k){S.timer={id,k,phase:"work",end:Date.now()+(Number(cfg().work)||25)*60000};storeTimer();clearInterval(S.tInt);S.tInt=setInterval(tickTimer,1000)}
function stopTimer(done){const tm=S.timer,rest=Number(cfg().rest)||0;
  if(done&&tm&&tm.phase!=="rest"&&rest>0){S.timer={id:tm.id,k:tm.k,phase:"rest",end:Date.now()+rest*60000};storeTimer()}
  else{clearInterval(S.tInt);S.tInt=null;S.timer=null;storeTimer()}
  if(done&&tm){chime();if(tm.phase==="rest")toast("Break over. Ready for the next one?");
    else{const h=hab(tm.id);if(h){if(isPomoNum(h))setVal(tm.k,h.id,(val(tm.k,h.id)||0)+1);else setPomo(tm.k,h,pval(tm.k,h)+1);persist();toast("Pomodoro logged on "+h.name+(rest>0?". Break time.":"."))}}}
  safeRender()}
function tickTimer(){if(!S.timer)return;const left=S.timer.end-Date.now();if(left<=0)return stopTimer(true);document.querySelectorAll(".ptime").forEach(el=>{el.textContent=fmtT(left)})}
function chime(){try{const C=window.AudioContext||window.webkitAudioContext;if(C){const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+1.2)}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function timerBtn(x,k){if(VIEW)return "";const tm=S.timer&&S.timer.id===x.id;
  if(tm)return '<button class="btn sm tbtn on" type="button" data-act="ptimer" data-h="'+esc(x.id)+'" data-k="'+k+'" aria-label="'+(S.timer.phase==="rest"?"Skip break":"Stop Pomodoro on "+esc(x.name))+'"><span class="ptime">'+fmtT(S.timer.end-Date.now())+'</span></button>';
  return '<button class="iconbtn" type="button" data-act="ptimer" data-h="'+esc(x.id)+'" data-k="'+k+'" aria-label="Start a '+(cfg().work||25)+'-minute Pomodoro on '+esc(x.name)+'" title="'+(cfg().work||25)+'-minute Pomodoro"'+(S.timer?' disabled':'')+'>'+CLOCK+'</button>'}
function pomoCard(M){const per=S.pomoPer||"week",cw=M.cw||M.N,lw=Math.max(1,cw-1);let a,b,lab;
  if(per==="last"){a=ws(lw);b=we(lw);lab="Week "+lw+" · "+md(ws(lw))+" – "+md(we(lw))}else if(per==="q4"){a=start();b=M.t<we(M.N)?M.t:we(M.N);lab=qShort()+" so far"}else{a=ws(cw);b=M.t<we(cw)?M.t:we(cw);lab="Week "+cw+" so far"}
  const byH={},byA={};let tot=0,days=0;
  for(let d=new Date(a);d<=b;d=add(d,1)){const k=key(d);let dt=0;cfg().habits.forEach(h=>{const n=pomoN(k,h);if(n){byH[h.id]=(byH[h.id]||0)+n;byA[h.area]=(byA[h.area]||0)+n;tot+=n;dt+=n}});if(dt)days++}
  const mins=Number(cfg().work)||25,hrs=n=>{const m=n*mins;return m>=60?(Math.round(m/6)/10)+" h":m+" min"};
  const seg='<div class="seg" role="group" aria-label="Pomodoro period">'+[["week","This week"],["last","Last week"],["q4",qShort()]].map(([v,l])=>'<button type="button" data-act="pper" data-v="'+v+'" aria-pressed="'+(per===v)+'">'+l+'</button>').join("")+'</div>';
  let h='<section class="card flat"><div class="hsec-h" style="padding:0"><h2>Pomodoros</h2><span class="spacer"></span>'+seg+'</div><p class="note" style="margin-top:6px">'+esc(lab)+' · each Pomodoro counts as '+mins+' minutes of focus.</p>';
  if(!tot)return h+'<p class="muted" style="margin-top:10px">No Pomodoros logged for this period yet. Start one from the clock on any habit in Today.</p></section>';
  h+='<div class="tiles3"><div class="tile"><span>Pomodoros</span><b>'+tot+'</b></div><div class="tile"><span>Focused time</span><b>'+hrs(tot)+'</b></div><div class="tile"><span>Per active day</span><b>'+(Math.round(tot/days*10)/10)+'</b><small>'+days+' day'+(days===1?"":"s")+'</small></div></div>';
  const ar=Object.keys(byA).sort((x,y)=>byA[y]-byA[x]),mA=byA[ar[0]];
  const hl=cfg().habits.filter(x=>byH[x.id]).sort((x,y)=>byH[y.id]-byH[x.id]),mH=byH[hl[0].id];
  const bar=(name,sub,n,mx)=>'<div class="prow2"><span class="pn2">'+esc(name)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span><span class="pg-b"><i class="r3" style="width:'+Math.max(4,Math.round(n/mx*100))+'%"></i></span><span class="pc2"><b>'+n+'</b><small>'+hrs(n)+'</small></span></div>';
  h+='<div class="pcols"><div><h3>By area</h3>'+ar.map(x=>bar(x,"",byA[x],mA)).join("")+'</div><div><h3>By habit</h3>'+hl.map(x=>bar(x.name,x.area,byH[x.id],mH)).join("")+'</div></div></section>';
  return h}

function ensureGoals(){if(VIEW)return;if(!D.goals||!Array.isArray(D.goals.list)){const g=GDEF();const ids=cfg().habits.map(h=>h.id);g.list.forEach(x=>{x.habits=x.habits.filter(id=>ids.indexOf(id)>=0)});D.goals=g;persist()}
  D.goals.log=D.goals.log||{};D.goals.ifthen=D.goals.ifthen||{}}
function gnum(v){return v==null||v===""||isNaN(Number(v))?null:Number(v)}
function fv(g,v){if(v==null)return "–";return g.money?"$"+Math.round(v).toLocaleString("en-CA"):String(Math.round(v*10)/10)}
function gget(id){return D.goals&&D.goals.list.find(g=>g.id===id)}
function itLine(id){const t=D.goals&&D.goals.ifthen&&D.goals.ifthen[id];return t?'<span class="it">'+esc(t)+'</span>':""}
function gstat(g,M){const G=D.goals,log=G.log||{},wk=Object.keys(log).map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  let cur=null,first=null,curW=null,lead=null,leadW=null;
  wk.forEach(w=>{const L=log[w]||{};const v=gnum(L[g.id]);if(v!=null){if(first==null)first=v;cur=v;curW=w}const l=gnum(L[g.id+"_lead"]);if(l!=null){lead=l;leadW=w}});
  const tgt=gnum(g.target),s0=gnum(g.start),base=s0!=null?s0:first;
  const since=pd(G.since||key(start())),dl=pd(G.deadline||key(we(W())));
  const exp=Math.max(0,Math.min(1,(M.t-since)/((dl-since)||1)));
  let p=null,s="none",reached=false;
  if(cur!=null&&tgt!=null){reached=g.dir==="down"?cur<=tgt:cur>=tgt;
    if(g.kind==="rating"){p=Math.max(0,Math.min(1,cur/tgt));s=reached?"ok":cur>=tgt-2?"warn":"bad"}
    else{if(reached)p=1;else if(base!=null&&tgt!==base)p=Math.max(0,Math.min(1,(cur-base)/(tgt-base)));else p=0;
      s=reached||p>=exp-.1?"ok":p>=exp-.3?"warn":"bad"}}
  const hl=M.hs.filter(h=>(g.habits||[]).indexOf(h.id)>=0);let Dn=0,T=0;hl.forEach(h=>{Dn+=h.D;T+=h.T});const hp=T?Dn/T:null;
  return {cur,curW,lead,leadW,base,tgt,exp,p,s,reached,hl,hp,hs:st(hp)}}
function insight(g,x){if(x.cur==null)return "Log your first number in the Sunday review to start tracking this goal.";
  if(x.reached)return "Target reached. Decide whether to raise it or hold it steady.";
  if(x.s==="ok")return "On pace. Keep the linked habits steady.";
  if(x.hs==="ok")return "Your habits are on track but the number isn’t keeping pace, so these habits may not be the right lever. Add or swap in one that hits this goal more directly.";
  return "The linked habits are behind. Fixing them is the fastest way to move this number."}

  h+='<details data-gd="'+esc(g.id)+'"'+(S.gOpen[g.id]?" open":"")+'><summary>WOOP plan</summary><div class="woop">'+[["wish","Wish","What you want"],["outcome","Outcome","How it will feel and what it changes"],["obstacle","Obstacle","The inner obstacle most likely to stop you"],["plan","Plan","If [the obstacle shows up], then I will…"]].map(([k,l,ph])=>'<div class="fld"><label for="gw-'+esc(g.id)+'-'+k+'">'+l+'</label><textarea id="gw-'+esc(g.id)+'-'+k+'" data-gw="'+k+'" data-g="'+esc(g.id)+'" placeholder="'+ph+'">'+esc(g[k]||"")+'</textarea></div>').join("")+'</div></details>';

/* ---------- pace engine ----------
   hstat(h,date): where a habit stands on a given day, ignoring that day's own tick so a row doesn't jump sections when ticked.
   s: due (no slack left, includes daily habits), planned (planned for this day, with slack), optional (on pace, room to spare),
      out (standard can't be reached this week), met (standard met before this day), free (standard 0). */
const DAYN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function planOf(w,id){const p=D.plans[w];return p&&p[id]||[]}
function isPlanned(h,w,di){return planOf(w,h.id).indexOf(di)>=0}
const flexible=h=>h.std>0&&h.std<7;
function hstat(h,dt){const w=weekOf(dt);if(w<1||w>W())return null;const di=Math.round((dt-ws(w))/DAY),k=key(dt);
  let other=0,openAfter=0,tot=0;for(let i=0;i<7;i++){const on=has(key(add(ws(w),i)),h.id);if(on)tot++;if(i!==di&&on)other++;if(i>di&&!on)openAfter++}
  const need=Math.max(0,h.std-other),avail=1+openAfter,planned=isPlanned(h,w,di),on=has(k,h.id);let s;
  if(!h.std)s="free";else if(!need)s="met";else if(need>avail)s="out";else if(need===avail)s="due";else s=planned?"planned":"optional";
  return {s,need,avail,on,planned,w,di,tot}}
function missedYesterday(h,dt){if(!h.std)return false;const y=add(dt,-1);if(y<start())return false;const ys=hstat(h,y);return !!ys&&!ys.on&&(h.std>=6||ys.planned||ys.s==="due")}
function paceTxt(h,x){if(!x)return "";
  if(x.s==="free")return "No target · "+x.tot+" this week";
  if(x.s==="met")return "Met for the week · "+x.tot+"/"+h.std;
  if(x.s==="out")return "Standard out of reach this week · "+x.tot+"/"+h.std+" · every day still counts";
  if(h.std===7)return "Daily · "+x.tot+"/7 this week";
  if(h.std===6&&x.s!=="due")return "6 of 7 days · "+x.tot+"/6 this week";
  const left=x.need+" more in "+x.avail+" day"+(x.avail===1?"":"s");
  return x.s==="due"?"No slack: "+left:x.s==="planned"?"Planned today · "+left:"On pace · "+left}
function weekCounts(M){const r={met:0,pace:0,risk:0,n:0,last:null,lastN:0};if(!M.cw)return r;
  M.hs.forEach(h=>{if(!h.std)return;r.n++;if(h.done[M.cw-1]>=h.std){r.met++;return}const x=hstat(h,M.t);
    if(x&&(x.s==="out"||(x.s==="due"&&h.std<7&&!x.on)))r.risk++;else r.pace++});
  if(M.lw){r.last=0;M.hs.forEach(h=>{if(!h.std)return;r.lastN++;if(h.done[M.lw-1]>=h.std)r.last++})}
  return r}

function dotRow(h,w,selK,t){let s="";for(let i=0;i<7;i++){const dt=add(ws(w),i),k=key(dt),on=has(k,h.id),pl=isPlanned(h,w,i);
    let c=on?"d-done":isMiss(k,h.id)?"d-x":k===selK?(pl?"d-todayplan":"d-today"):dt<t?"d-miss":pl?"d-plan":"d-future";s+='<span class="dot '+c+'"></span>'}
  return '<span class="dots" aria-hidden="true">'+s+'</span>'}
function rowTag(x,stt,miss,mk){if(mk)return '<span class="tag t-quiet">Not done</span>';if(miss)return '<span class="tag t-risk">Missed yesterday</span>';if(!stt)return "";
  if(stt.s==="due"&&x.std<7)return '<span class="tag t-risk">No slack</span>';if(stt.s==="planned")return '<span class="tag t-plan">Planned</span>';
  if(stt.s==="out")return '<span class="tag t-quiet">Out of reach</span>';return ""}
function countTxt(x,w){const d=x.done[w-1];return x.std?d+"/"+x.std:String(d)}
function habitRow(x,k,w,stt,miss,M){const on=has(k,x.id),mk=isMiss(k,x.id)&&!on,tag=rowTag(x,stt,miss,mk),isT=k===key(M.t),pc=pval(k,x),g=pgoal(x);

  if(isT&&!VIEW){const y=add(d,-1),yk=key(y);if(inRange(y)&&UI.ydone!==yk){if(!S.ylist||S.ylist.k!==yk)S.ylist={k:yk,ids:M.hs.filter(x=>x.std>0&&!isNum(x)&&!has(yk,x.id)).map(x=>x.id)};

function thisWeekPanel(M){if(!M.cw)return "";const w=M.cw,di=Math.round((M.t-ws(w))/DAY),el=di+1,C=weekCounts(M);let a=0,b=0,best=0,rate=0;const rows=[];

function stuckList(M){if(M.lw<2||!M.logged[M.lw-2])return [];const seen=cfg().stuckSeen||{};

/* ---------- commitments linked to habits ---------- */
function linkHabit(t){let text=String(t).trim(),id="";const m=text.match(/\s*\[([^\]]+)\]\s*\.?\s*$/);const H=cfg().habits;
  if(m){const nm=m[1].toLowerCase().trim();const h=H.find(x=>x.name.toLowerCase()===nm)||H.find(x=>x.name.toLowerCase().indexOf(nm)>=0||nm.indexOf(x.name.toLowerCase())>=0);if(h){id=h.id;text=text.slice(0,m.index).trim()}}

function commitTxt(c,w,M){const h=c.habit&&M.hs.find(x=>x.id===c.habit),am=autoMark(c,w,M);

/* ---------- coach ----------

const TONES=[["cheer","Cheerleader: celebrates every win"],["supportive","Supportive: kind, encouraging and honest"],["direct","Direct: clear verdicts and fixes, no fluff"],["tough","Tough love: blunt, calls out excuses"],["nobs","No BS: zero sugarcoating, short and hard"]];

const HEADS=["from your review","last week's commitments","wins","fix first","patterns","biggest lever","commitments","pace check","today's move","commitments check","this week's plan"];

function outcomeOf(h){return (cfg().outcomes||[]).find(o=>o.id===h.outcome)||null}
function commitWeek(M){if(!M.cw)return null;const sun=key(M.t)===key(we(M.cw));return sun&&M.cw<M.N?M.cw+1:M.cw}
function defaultMode(M){const wd=(M.t.getDay()+6)%7;return wd>=2&&wd<=5?"midweek":"weekly"}

function fmtCoach(t){let out="",open=false,list=false;const endList=()=>{if(list){out+='</ul>';list=false}},endSec=()=>{endList();if(open){out+='</section>';open=false}};
  String(t).split("\n").forEach(l=>{const c=l.replace(/^[#*\s]+|[*:\s]+$/g,""),hk=c.toLowerCase().replace(/[’‘]/g,"'");
    if(c&&c.length<40&&HEADS.indexOf(hk)>=0){endSec();out+='<section class="cs cs-'+hk.replace(/[^a-z]+/g,"-")+'"><h3 class="ch">'+esc(c)+'</h3>';open=true;return}
    const b=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);if(b){if(!list){out+='<ul>';list=true}out+='<li>'+esc(b[1].replace(/\*\*/g,""))+'</li>';return}
    endList();if(l.trim())out+='<p>'+esc(l.replace(/\*\*/g,""))+'</p>'});
  endSec();return out}
function parseCommits(t){const L=String(t).split("\n");let at=-1;
  L.forEach((l,i)=>{const c=l.replace(/^[#*\s]+|[*:\s]+$/g,"").toLowerCase();if(c==="commitments")at=i});if(at<0)return [];
  const r=[];for(let i=at+1;i<L.length;i++){const c=L[i].replace(/^[#*\s]+|[*:\s]+$/g,"").toLowerCase();if(c&&HEADS.indexOf(c.replace(/[’‘]/g,"'"))>=0)break;
    const b=L[i].match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);if(b&&b[1].trim())r.push(b[1].replace(/\*\*/g,"").trim())}return r.slice(0,5)}

function systemPrompt(){const tone=TONE_TXT[cfg().tone||"direct"]||TONE_TXT.direct;return [
 "You are my personal habit coach for "+cfg().label+". "+tone,

 "Use my real numbers. Look for day-of-week and sequence patterns in the daily grid. Respect my day notes: do not scold me for days marked travel, sick or rest; judge the pattern around them.",
 "You can see summaries of our past sessions: build on them, follow up on what you suggested, and change tactics on advice that has not worked instead of repeating it.",
 "When I have answered my Sunday review, my own words matter more than any number: anchor the coaching on them.",

function weekdayRates(M,list){const r=[0,0,0,0,0,0,0],n=[0,0,0,0,0,0,0];
  M.logged.forEach((lg,wi)=>{if(!lg)return;for(let d=0;d<7;d++){const k=key(add(ws(wi+1),d));list.forEach(h=>{if(!h.std)return;n[d]++;if(has(k,h.id))r[d]++})}});

/* Coaching week: weekly coaching reviews week R (chosen by the user) and sets commitments for week T, the next week still ahead. */
function defaultRWeek(M){if(!M.cw)return M.N;const sun=key(M.t)===key(we(M.cw));return sun||M.cw===1?M.cw:M.cw-1}

const wkDates=w=>md(ws(w))+" - "+md(we(w));

    const it=D.goals.ifthen||{},ks=Object.keys(it).filter(k=>it[k]);if(ks.length)L.push("If-then plans: "+ks.map(k=>(hab(k)||{name:k}).name+": "+it[k]).join("; "));

    O.forEach(o=>{const hs=M.hs.filter(h=>h.outcome===o.id);L.push("- ["+o.area+"] "+o.text+" | habits: "+(hs.length?hs.map(h=>h.name+" "+pct(h.p)).join(", "):"none linked yet"))})}

function showReport(d){const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
